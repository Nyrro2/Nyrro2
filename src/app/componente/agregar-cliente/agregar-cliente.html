<div class="container mt-5">
    <h2 class="d-flex justify-content-center mb-5 mx-4 " >
        <i class="bi bi-person-fill-add mx-4"></i> 
        Agregar Cliente</h2>
</div>

<!-- Two way binging para sincronizar los elementos -->
<form (ngSubmit)="onSubmit()">

    <div class="container mt-6 d-flex justify-content-center">
        <label for="nombreCliente" class="form-label">Nombre del cliente: </label>
        <input type="text" id="nombreCliente" name='nombreCliente' class=" mb-5  mx-4 d-flex justify-content-center  w-25" placeholder="Escribe el Nombre del nuevo Cliente " autocomplete="off" [(ngModel)]="cliente.nombre">

        <span>
            <button type="submit" class="btn btn-primary w25 d-flex justify-content-between"(click)="agregarCliente()">
                <i class="bi bi-person-check-fill"> Agregar</i> 
            </button>
        </span>

    </div>
    <!-- Se comento buscando Por que ando buscando un error -->
    <div>
        <table class="table table-striped table-hover align-middle">
            <thead>
                
                <tr>
                    <!-- <th scope="col">Id</th> -->
                    <th scope="col">Nombre</th>
                </tr>
            </thead>
            <tbody>
                @for (cliente of clientes; track cliente.idCliente) {
                <tr>
                     <!-- <td>{{cliente.idCliente}}</td> -->

                    <td>{{cliente.nombre}}</td>
                </tr>
            }
            
            </tbody>

        </table>
    </div>
</form>
