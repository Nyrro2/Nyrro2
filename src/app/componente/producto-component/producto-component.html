
<ul class="list-group mt-1">
    @for(producto of productos; track productos){
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <span class="flex-grow-1">{{producto.codigo}}</span>
            <button class="btn btn-sm btn-danger" (click)="eliminarPedido(producto)"></button>
            <span class="flex-grow-1">{{producto.descripcion}}</span>
            <span class="flex-grow-1">{{producto.undMed}}</span>
            <span class="flex-grow-1">{{producto.precio | currency:'$ '}}</span>
            <span class="flex-grow-1"><input class="w-25"  type="number" id="cantidad"></span>
        </li>
    }
</ul>
